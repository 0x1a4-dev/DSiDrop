# If used, copy as /_nds/romsfinder.ini on the SD card.
# IPv4 address of the computer running DSiDrop. Do not add http://.
# Press SELECT in the app to open server and Wi-Fi settings.
# Replace this documentation placeholder with your PC's actual IPv4 address.
host=192.0.2.1
port=3000

# Custom WPA2/AES profile in DSi mode, independent of DS WEP profiles.
# Leave blank to enter the SSID and password when the app first starts.
# Password: 8-63 printable ASCII characters or 64 hex characters (raw PSK).
# Values after = are preserved, including spaces and #.
# Credentials are stored as plain text on the SD card.
# To use DSi system profiles instead, set wifi_mode=firmware.
wifi_mode=wpa2
wifi_ssid=
wifi_password=
